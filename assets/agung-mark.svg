<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Agung Laksono — Cyber Shield Monogram</title>
  <desc id="desc">Animated penetration system core shield monogram</desc>
  <defs>
    <style>
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); filter: drop-shadow(0 0 4px #00FF66); }
        50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 12px #00FF66); }
      }
      .ring {
        transform-origin: 256px 256px;
        animation: spin 20s linear infinite;
      }
      .ring-reverse {
        transform-origin: 256px 256px;
        animation: spin 30s linear reverse infinite;
      }
      .core-glow {
        transform-origin: 256px 256px;
        animation: pulse 3s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#00FF66" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>
  </defs>

  <!-- Base background card -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="4"/>
  
  <!-- Subtle Grid lines -->
  <path d="M64 256h384M256 64v384" stroke="#1F2937" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Animated Cyber Rings -->
  <g class="ring">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="20 40 60 40" opacity="0.5"/>
    <circle cx="256" cy="45" r="5" fill="#00FF66"/>
    <circle cx="256" cy="467" r="5" fill="#00FF66"/>
  </g>
  <g class="ring-reverse">
    <circle cx="256" cy="256" r="195" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="10 30" opacity="0.3"/>
    <circle cx="61" cy="256" r="4" fill="#00F0FF"/>
    <circle cx="451" cy="256" r="4" fill="#00F0FF"/>
  </g>

  <!-- Outer Cyber Hex Shield -->
  <g class="core-glow">
    <polygon points="256,70 410,150 410,330 256,440 102,330 102,150" fill="none" stroke="url(#shieldGrad)" stroke-width="8"/>
    <!-- Inner Shield Fill -->
    <polygon points="256,86 394,158 394,322 256,422 118,322 118,158" fill="#111827" opacity="0.9"/>
  </g>

  <!-- Monogram A + Z Embedded Geometry -->
  <!-- 'A' Structure -->
  <path d="M256 120 L340 280 H300 L256 195 L212 280 H172 Z" fill="#00FF66"/>
  <!-- Crossbar & 'Z' Slash -->
  <path d="M200 240 H312 L180 360 H340 V385 H170 V360 L300 240 H200 Z" fill="#00F0FF"/>

  <!-- Center Core Security Node -->
  <circle cx="256" cy="240" r="14" fill="#090C10" stroke="#00FF66" stroke-width="4"/>
  <circle cx="256" cy="240" r="5" fill="#00FF66"/>

  <!-- Tech Node Connectors -->
  <circle cx="256" cy="70" r="6" fill="#00F0FF"/>
  <circle cx="410" cy="150" r="6" fill="#00FF66"/>
  <circle cx="410" cy="330" r="6" fill="#9333EA"/>
  <circle cx="256" cy="440" r="6" fill="#00FF66"/>
  <circle cx="102" cy="330" r="6" fill="#9333EA"/>
  <circle cx="102" cy="150" r="6" fill="#00F0FF"/>
</svg>
