<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Agung Laksono — Tactical Monolith Monogram</title>
  <desc id="desc">Industrial stealth monogram in copper and slate</desc>
  <defs>
    <style>
      /* Smooth reflections and slow rotations for tactical feel */
      @keyframes spin-slow { 
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); } 
      }
      @keyframes pulse-subtle {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px rgba(215,154,91,0.3)); }
      }
      .ring-outer {
        transform-origin: 256px 256px;
        animation: spin-slow 40s linear infinite;
      }
      .ring-inner {
        transform-origin: 256px 256px;
        animation: spin-slow 25s linear reverse infinite;
      }
      .copper-glow {
        animation: pulse-subtle 4s ease-in-out infinite;
      }
    </style>

    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B081"/>
      <stop offset="50%" stop-color="#D79A5B"/>
      <stop offset="100%" stop-color="#A56E3B"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <!-- Base background card -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" stroke="#222222" stroke-width="2"/>
  
  <!-- Geometric structural lines -->
  <path d="M64 256h384M256 64v384" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M120 120l272 272M120 392l272-272" stroke="#151515" stroke-width="2"/>
  
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Tactical Rings -->
  <g class="ring-outer">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="8 24"/>
    <circle cx="256" cy="46" r="4" fill="#D79A5B"/>
    <circle cx="256" cy="466" r="4" fill="#D79A5B"/>
  </g>

  <g class="ring-inner">
    <circle cx="256" cy="256" r="190" fill="none" stroke="#718B78" stroke-width="1.5" stroke-dasharray="40 80" opacity="0.6"/>
  </g>

  <!-- Monolith Core Base -->
  <polygon points="256,80 400,160 400,352 256,432 112,352 112,160" fill="#0D0D0D" stroke="#222222" stroke-width="4"/>

  <!-- Inner Bevel/Structure -->
  <polygon points="256,100 376,170 376,342 256,412 136,342 136,170" fill="#141414"/>

  <!-- Monogram A + Z (Copper & Sage/Steel) -->
  <g class="copper-glow">
    <!-- 'A' Structure in Copper -->
    <path d="M256 130 L340 280 H300 L256 195 L212 280 H172 Z" fill="url(#copperGrad)"/>
    <!-- Crossbar & 'Z' Slash in Steel/Sage -->
    <path d="M200 240 H312 L180 360 H340 V385 H170 V360 L300 240 H200 Z" fill="#8E918F"/>
  </g>

  <!-- Central Locking Node -->
  <circle cx="256" cy="240" r="12" fill="#0A0A0A" stroke="url(#copperGrad)" stroke-width="3"/>

  <!-- Perimeter Nodes -->
  <circle cx="256" cy="80" r="5" fill="#444444"/>
  <circle cx="400" cy="160" r="5" fill="#444444"/>
  <circle cx="400" cy="352" r="5" fill="#444444"/>
  <circle cx="256" cy="432" r="5" fill="#444444"/>
  <circle cx="112" cy="352" r="5" fill="#444444"/>
  <circle cx="112" cy="160" r="5" fill="#444444"/>

</svg>
