<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agung Laksono — Senior Fullstack & Penetration Systems Engineer</title>
  <desc id="desc">Cybersecurity terminal and systems engineering hero banner</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <linearGradient id="bgFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="greenCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgFade)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>

  <!-- Left Header Content -->
  <g transform="translate(60, 55)">
    <!-- Top accent bar -->
    <rect x="0" y="0" width="56" height="4" rx="2" fill="#00FF66"/>
    <text x="68" y="6" fill="#00FF66" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="2">● PENETRATION OPS : ONLINE</text>

    <!-- Name & Title -->
    <text x="0" y="52" fill="#F3F4F6" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" letter-spacing="1">AGUNG LAKSONO</text>
    <text x="0" y="86" fill="url(#greenCyanGrad)" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">SENIOR FULLSTACK &amp; PENETRATION SYSTEMS ENGINEER</text>

    <!-- Subtitle description -->
    <text x="0" y="142" fill="#9CA3AF" font-family="Georgia, serif" font-size="20">Architecting secure multi-tenant platforms, financial engines,</text>
    <text x="0" y="172" fill="#9CA3AF" font-family="Georgia, serif" font-size="20">penetration system isolation, and production AI/RAG pipelines.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 220)" font-family="'Courier New', monospace" font-size="12" font-weight="700">
      <!-- Badge 1 -->
      <rect width="180" height="34" rx="6" fill="#111827" stroke="#00FF66" stroke-width="1.5"/>
      <text x="14" y="22" fill="#00FF66">⚡ PENETRATION SYSTEMS</text>

      <!-- Badge 2 -->
      <rect x="194" width="170" height="34" rx="6" fill="#111827" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="208" y="22" fill="#00F0FF">🛡️ ZERO-TRUST SAAS</text>

      <!-- Badge 3 -->
      <rect x="378" width="130" height="34" rx="6" fill="#111827" stroke="#9333EA" stroke-width="1.5"/>
      <text x="392" y="22" fill="#C084FC">🤖 AI / RAG</text>

      <!-- Badge 4 -->
      <rect x="522" width="110" height="34" rx="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="536" y="22" fill="#FBBF24">📈 FINTECH</text>
    </g>
  </g>

  <!-- Right Side: Cybersecurity Terminal Frame -->
  <g transform="translate(690, 45)">
    <!-- Terminal Box -->
    <rect width="450" height="330" rx="12" fill="#0D1117" stroke="#1F2937" stroke-width="2"/>
    <!-- Header Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 438 0 Q 450 0 450 12 L 450 36 L 0 36 Z" fill="#161B22"/>
    <!-- Controls -->
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="38" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="18" r="6" fill="#10B981"/>
    <text x="80" y="22" fill="#9CA3AF" font-family="'Courier New', monospace" font-size="12">zippo-sec-kernel v3.4 — bash</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 60)" font-family="'Courier New', monospace" font-size="13">
      <text x="0" y="20" fill="#00F0FF">$ zippo-sec --target prod.net --audit</text>
      <text x="0" y="48" fill="#9CA3AF">[+] Initializing Security Audit...</text>
      <text x="0" y="76" fill="#00FF66">[+] Port 443 (TLS 1.3): ENCRYPTED [OK]</text>
      <text x="0" y="104" fill="#00FF66">[+] Tenant Isolation: PASS (0 Leak)</text>
      <text x="0" y="132" fill="#00FF66">[+] Pentest Scan: 0 Vulnerabilities</text>
      <text x="0" y="160" fill="#F59E0B">[+] Performance: +40% Optimized</text>
      <text x="0" y="196" fill="#00FF66">[✓] AUDIT COMPLETE - SYSTEM SECURE</text>

      <!-- Terminal Prompt with blinking cursor -->
      <text x="0" y="234" fill="#00F0FF">zippo@sec-node:~$ <tspan fill="#00FF66">█</tspan></text>
    </g>
  </g>
</svg>
