<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agung Laksono — Senior Fullstack &amp; Penetration Systems Engineer</title>
  <desc id="desc">Industrial stealth terminal and systems engineering hero banner</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }

      /* Slow panning grid */
      @keyframes pan {
        0% { transform: translateY(0); }
        100% { transform: translateY(-32px); }
      }
      .grid-layer {
        animation: pan 15s linear infinite;
      }

      /* Terminal Typing Effect */
      .line { opacity: 0; }
      .l1 { animation: fadeLine 0.4s forwards 0.5s; }
      .l2 { animation: fadeLine 0.4s forwards 1.5s; }
      .l3 { animation: fadeLine 0.4s forwards 2.5s; }
      .l4 { animation: fadeLine 0.4s forwards 3.5s; }
      .l5 { animation: fadeLine 0.4s forwards 4.5s; }
      .l6 { animation: fadeLine 0.4s forwards 5.5s; }
      .l7 { animation: fadeLine 0.4s forwards 6.5s; }

      @keyframes fadeLine {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Subtle breathing pulse for badges */
      @keyframes breathe {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(215,154,91,0)); border-color: #333; }
        50% { filter: drop-shadow(0 4px 6px rgba(215,154,91,0.1)); }
      }
      .badge-glow {
        animation: breathe 4s ease-in-out infinite;
      }
      
      /* Solid blinking block cursor */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.2s step-end infinite;
      }
    </style>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B081"/>
      <stop offset="100%" stop-color="#D79A5B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="0" fill="url(#bgGrad)"/>
  
  <svg x="0" y="0" width="1200" height="420">
    <rect width="1200" height="460" fill="url(#grid)" class="grid-layer"/>
  </svg>

  <!-- Accent Top Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#copperGrad)"/>

  <!-- Left Header Content -->
  <g transform="translate(70, 65)">
    
    <!-- Status Indicator -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="48" height="6" rx="1" fill="#718B78"/>
      <text x="64" y="8" fill="#A3A3A3" font-size="13" font-weight="500" letter-spacing="2" class="mono">SYSTEM OPS: SECURE</text>
    </g>

    <!-- Name & Title -->
    <text x="0" y="70" fill="#F8FAFC" font-size="52" font-weight="900" letter-spacing="-1">AGUNG LAKSONO</text>
    <text x="0" y="110" fill="url(#copperGrad)" font-size="20" font-weight="700" letter-spacing="1">SENIOR FULLSTACK &amp; PENETRATION SYSTEMS ENGINEER</text>

    <!-- Subtitle description -->
    <text x="0" y="170" fill="#94A3B8" font-size="20" font-weight="400" line-height="1.6">Architecting secure multi-tenant platforms, financial engines,</text>
    <text x="0" y="200" fill="#94A3B8" font-size="20" font-weight="400" line-height="1.6">penetration system isolation, and production AI/RAG pipelines.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 260)">
      <!-- Badge 1: Copper -->
      <g class="badge-glow" transform="translate(0, 0)">
        <rect width="180" height="36" rx="4" fill="#111111" stroke="#D79A5B" stroke-width="1.5"/>
        <text x="16" y="23" fill="#D79A5B" font-size="13" font-weight="500" class="mono">PENTEST SYSTEMS</text>
      </g>

      <!-- Badge 2: Sage -->
      <g transform="translate(196, 0)">
        <rect width="170" height="36" rx="4" fill="#111111" stroke="#718B78" stroke-width="1.5"/>
        <text x="16" y="23" fill="#718B78" font-size="13" font-weight="500" class="mono">ZERO-TRUST SAAS</text>
      </g>

      <!-- Badge 3: Steel -->
      <g transform="translate(382, 0)">
        <rect width="110" height="36" rx="4" fill="#111111" stroke="#8E918F" stroke-width="1.5"/>
        <text x="16" y="23" fill="#A3A3A3" font-size="13" font-weight="500" class="mono">AI &amp; RAG</text>
      </g>

      <!-- Badge 4: Amber/Copper -->
      <g transform="translate(508, 0)">
        <rect width="110" height="36" rx="4" fill="#111111" stroke="#A33B3B" stroke-width="1.5"/>
        <text x="16" y="23" fill="#C95F5F" font-size="13" font-weight="500" class="mono">FINTECH</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Clean Industrial Terminal Window -->
  <g transform="translate(730, 50)">
    
    <!-- Outer Terminal Casing -->
    <rect width="410" height="310" rx="6" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="2"/>
    
    <!-- Header Bar -->
    <path d="M 0 6 Q 0 0 6 0 L 404 0 Q 410 0 410 6 L 410 32 L 0 32 Z" fill="#141414"/>
    <path d="M 0 32 L 410 32" stroke="#2A2A2A" stroke-width="1"/>
    
    <!-- Controls (Muted dots) -->
    <circle cx="20" cy="16" r="5" fill="#333333"/>
    <circle cx="36" cy="16" r="5" fill="#333333"/>
    <circle cx="52" cy="16" r="5" fill="#333333"/>
    
    <text x="76" y="20" fill="#666666" font-size="12" font-weight="500" class="mono">ops_dashboard // node_01</text>

    <!-- Terminal Content Area -->
    <g transform="translate(24, 70)" font-size="14" class="mono">
      
      <!-- Line 1 -->
      <g class="line l1">
        <text x="0" y="0" fill="#D79A5B">&gt;</text>
        <text x="16" y="0" fill="#E5E5E5">init_audit --target prod-cluster</text>
      </g>
      
      <!-- Line 2 -->
      <g class="line l2">
        <text x="0" y="32" fill="#777777">Verifying zero-trust boundaries...</text>
      </g>
      
      <!-- Line 3 -->
      <g class="line l3">
        <text x="0" y="64" fill="#718B78">[OK]</text>
        <text x="44" y="64" fill="#CCCCCC">Port 443 / TLS 1.3</text>
        <text x="210" y="64" fill="#718B78">ENCRYPTED</text>
      </g>
      
      <!-- Line 4 -->
      <g class="line l4">
        <text x="0" y="96" fill="#718B78">[OK]</text>
        <text x="44" y="96" fill="#CCCCCC">Tenant Isolation</text>
        <text x="210" y="96" fill="#718B78">100% SECURE</text>
      </g>

      <!-- Line 5 -->
      <g class="line l5">
        <text x="0" y="128" fill="#718B78">[OK]</text>
        <text x="44" y="128" fill="#CCCCCC">Vulnerability Scan</text>
        <text x="210" y="128" fill="#718B78">0 DETECTED</text>
      </g>
      
      <!-- Line 6 -->
      <g class="line l6">
        <text x="0" y="160" fill="#D79A5B">[INFO]</text>
        <text x="60" y="160" fill="#CCCCCC">Throughput Optimization</text>
        <text x="260" y="160" fill="#D79A5B">+40% GAIN</text>
      </g>
      
      <!-- Line 7 -->
      <g class="line l7">
        <text x="0" y="210" fill="#D79A5B">&gt;</text>
        <rect x="16" y="198" width="8" height="14" fill="#D79A5B" class="cursor"/>
      </g>
      
    </g>
  </g>
</svg>
